[project]
name = "gltcstdio"
version = "0.1.0"
description = "769 configurable GPU image filters, chainable into graphs"
requires-python = ">=3.10"
dependencies = [
    "moderngl>=5.10",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gltcstdio"]

[tool.hatch.build.targets.wheel.force-include]
"gltcstdio/data" = "gltcstdio/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
