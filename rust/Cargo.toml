[workspace]
resolver = "2"
members = [
    "crates/gltcstdio",
    "crates/gltcstdio-py",
    "crates/gltcstdio-wasm",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "27"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
