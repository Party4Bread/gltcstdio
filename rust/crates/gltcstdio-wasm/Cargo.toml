[package]
name = "gltcstdio-wasm"
version.workspace = true
edition.workspace = true
description = "WebGPU bindings for gltcstdio"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gltcstdio = { path = "../gltcstdio", default-features = false, features = ["gpu"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
log = { workspace = true }
